# Serves the built Angular app. Sign-in, register and forgot-password are prerendered pages; every other
# route is rendered in the browser from index.csr.html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # For the load balancer and container health checks
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/ is passed to the backend when BACKEND_URL is set (docker compose). On AWS the load balancer sends
    # /api/* straight to the backend, so this file is empty there. Written at start-up by 40-api-proxy.sh.
    include /tmp/nginx/api-proxy*.conf;

    # Build output with a content hash in the name never changes, so browsers can keep it for a year
    # (quoted: nginx reads an unquoted { as the start of a block)
    location ~* "-[A-Za-z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Any other file that doesn't exist is a 404, not the app
    location ~* \.(js|css|map|ico|png|jpg|svg|webp|woff2?|ttf|txt|json)$ {
        try_files $uri =404;
    }

    location / {
        # Pages always revalidate, so a deploy is picked up on the next load
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/index.html /index.csr.html;
    }
}
