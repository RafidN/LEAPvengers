<section hlmCard class="w-[340px] text-center shadow-[0_0_30px_#0a230f] ring-0">
  <div hlmCardHeader>
    <h1 hlmCardTitle class="text-3xl">Welcome to S.H.I.E.L.D.</h1>
    <p hlmCardDescription>Sign in to manage your digital portfolio.</p>
  </div>

  <form hlmCardContent class="flex flex-col gap-3 text-left" (ngSubmit)="onSubmit()">
    <div class="flex flex-col gap-1.5">
      <label hlmLabel for="username">Username</label>
      <input hlmInput id="username" name="username" class="h-11 bg-input" placeholder="Enter your username" autocomplete="username"
        required [(ngModel)]="username" [disabled]="isLoading()" />
    </div>
    <div class="flex flex-col gap-1.5">
      <label hlmLabel for="password">Password</label>
      <input hlmInput id="password" type="password" name="password" class="h-11 bg-input" placeholder="••••••••••••"
        autocomplete="current-password" required [(ngModel)]="password" [disabled]="isLoading()" />
    </div>

    @if (errorMessage()) {
      <div hlmAlert variant="destructive">
        <p hlmAlertDescription>{{ errorMessage() }}</p>
      </div>
    }

    <div class="flex justify-end text-sm">
      <a routerLink="/forgot-password">Forgot password?</a>
    </div>

    <button hlmBtn type="submit" size="lg" class="h-11 w-full font-bold" [disabled]="isLoading()">
      {{ isLoading() ? 'Signing in...' : 'Sign in to Dashboard' }}
    </button>

    <p class="text-muted-foreground text-center text-sm">
      Don't have an account? <a routerLink="/register">Sign up</a>
    </p>

    <div class="flex flex-col gap-2 border-t border-white/10 pt-3">
      <p class="text-muted-foreground text-center text-xs tracking-widest uppercase">Demo personas</p>
      <div class="grid grid-cols-3 gap-2">
        @for (p of personas; track p.username) {
          <button hlmBtn type="button" variant="ghost" class="h-auto flex-col gap-0 border border-white/15 py-2"
            [disabled]="isLoading()" (click)="signInAs(p.username)">
            <span class="font-semibold">{{ p.name }}</span>
            <span class="text-muted-foreground text-xs">{{ p.role }}</span>
          </button>
        }
      </div>
    </div>
  </form>

  <p class="text-muted-foreground text-xs tracking-wide">PROTECTED BY THE LEAPVENGERS</p>
</section>
