<section hlmCard class="w-[340px] text-center shadow-[0_0_30px_#0a230f] ring-0">
  <div hlmCardHeader>
    <h1 hlmCardTitle class="text-2xl">Forgot password</h1>
    <p hlmCardDescription>Enter your details to reset your password.</p>
  </div>

  <form hlmCardContent class="flex flex-col gap-3 text-left" (ngSubmit)="onSubmit()">
    @if (errorMessage()) {
      <div hlmAlert variant="destructive">
        <p hlmAlertDescription>{{ errorMessage() }}</p>
      </div>
    }
    @if (successMessage()) {
      <div hlmAlert>
        <p hlmAlertDescription class="text-primary">{{ successMessage() }}</p>
      </div>
    }

    <input hlmInput name="username" class="h-11 bg-input" placeholder="Username" aria-label="Username"
      required [(ngModel)]="username" [disabled]="isLoading()" />
    <input hlmInput type="email" name="email" class="h-11 bg-input" placeholder="Email address" aria-label="Email address"
      required [(ngModel)]="email" [disabled]="isLoading()" />

    <button hlmBtn type="submit" size="lg" class="h-11 w-full font-bold" [disabled]="isLoading()">
      {{ isLoading() ? 'Resetting password...' : 'Reset password' }}
    </button>

    <p class="text-muted-foreground text-center text-sm">
      Remember your account? <a routerLink="/sign-in">Sign in</a>
    </p>
  </form>
</section>
