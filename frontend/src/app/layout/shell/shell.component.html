<header class="bg-card/80 sticky top-0 z-10 border-b backdrop-blur">
  <nav class="mx-auto flex h-14 max-w-6xl items-center gap-1 px-4">
    <a [routerLink]="homePage" class="mr-4 flex items-center gap-2 font-semibold">
      <ng-icon name="lucideShield" class="text-success text-xl" />
      <span class="hidden font-[family-name:var(--font-heading)] tracking-tight text-success lg:inline">S.H.I.E.L.D.</span>
    </a>

    @for (link of links; track link.path) {
      <a hlmBtn variant="ghost" [routerLink]="link.path" routerLinkActive="bg-muted text-foreground">
        <ng-icon [name]="link.icon" />
        <span class="hidden sm:inline">{{ link.label }}</span>
      </a>
    }

    <div class="ml-auto flex items-center gap-3">
      @if (marketOpen()) {
        <div class="inline-flex items-center gap-2 rounded-full border border-primary/30 bg-primary/10 px-3 py-1 text-primary" aria-label="Market open status">
          <span class="h-1.5 w-1.5 rounded-full bg-current" aria-hidden="true"></span>
          <span class="hidden sm:inline text-xs font-medium tracking-wide">MARKET OPEN</span>
        </div>
      }

      @if (firstName) {
        <a hlmBtn variant="ghost" class="text-foreground hidden items-center gap-2 text-sm md:inline-flex"
          routerLink="/settings" aria-label="Open profile settings">
          <ng-icon [name]="profileIconName" class="text-primary text-lg" aria-hidden="true" />
          <b>{{ firstName }}</b>
        </a>
        @if (role === 'OPS' || role === 'ANALYST') {
          <span hlmBadge variant="secondary" class="hidden md:inline-flex">
            {{ roleLabel }}
          </span>
        }
      }
      <button hlmBtn variant="ghost" size="icon" type="button" (click)="toggleLightDark()"
        [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'">
        <ng-icon [name]="isDarkMode ? 'lucideSun' : 'lucideMoon'" />
      </button>
      <button hlmBtn variant="outline" (click)="signOut()">
        <ng-icon name="lucideLogOut" />
        <span class="hidden sm:inline">Sign out</span>
      </button>
    </div>
  </nav>
</header>

<main class="mx-auto max-w-6xl px-4 py-8">
  <router-outlet />
</main>
