<header class="bg-card/80 sticky top-0 z-10 border-b backdrop-blur">
  <nav class="mx-auto flex h-14 max-w-6xl items-center gap-2 px-4">
    <a routerLink="/dashboard" class="mr-4 flex items-center gap-2 font-semibold">
      <ng-icon name="lucideShield" class="text-primary text-xl" />
      <span class="font-[family-name:var(--font-heading)] tracking-tight">S.H.I.E.L.D.</span>
    </a>

    @for (link of links; track link.path) {
      <a hlmBtn variant="ghost" [routerLink]="link.path" routerLinkActive="bg-muted text-foreground"
        class="text-muted-foreground">
        <ng-icon [name]="link.icon" />
        <span class="hidden sm:inline">{{ link.label }}</span>
      </a>
    }

    <div class="ml-auto flex items-center gap-3">
      @if (username) {
        <span class="text-muted-foreground hidden text-sm md:inline">Signed in as <b class="text-foreground">{{ username }}</b></span>
      }
      <button hlmBtn variant="outline" (click)="signOut()">
        <ng-icon name="lucideLogOut" />
        <span class="hidden sm:inline">Sign out</span>
      </button>
    </div>
  </nav>
</header>

<main class="mx-auto max-w-6xl px-4 py-8">
  <router-outlet />
</main>
