# Isolated test datasource so context-load tests do not depend on local Postgres schema
spring.datasource.url=jdbc:h2:mem:leaptest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS reporting
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Keep app context path consistent for any MVC tests that may use this profile
server.servlet.context-path=/api

# Integration tests wait for orders to fill, so keep the delay short
leap.trading.order-delay=PT0.5S
# Tests trade whatever the time of day; MarketHoursTest covers the hours themselves
leap.trading.enforce-market-hours=false
# Tests run the unfinished-order sweep themselves rather than on a timer
leap.trading.recovery-enabled=false

# Tests run reporting loads themselves rather than on a timer; create the reporting schema in H2
leap.reporting.load-enabled=false
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
