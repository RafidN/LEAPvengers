# Isolated test datasource so context-load tests do not depend on local Postgres schema
spring.datasource.url=jdbc:h2:mem:leaptest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Keep app context path consistent for any MVC tests that may use this profile
server.servlet.context-path=/api

# Integration tests wait for orders to fill, so keep the delay short
leap.trading.order-delay=PT0.5S
