# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Application Name
spring.application.name=leap-backend

# Logging
logging.level.root=INFO
logging.level.com.neueda.leap=DEBUG

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Settings that differ per environment come from environment variables; the defaults after ':' are for local
# development only. The prod profile (application-prod.properties) has no defaults, so it won't start without them.

# JWT Configuration
jwt.secret=${JWT_SECRET:QWERTYUIOPASDFGHJKLZXCVBNM1234567890abcdefABCDEFGH}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/leapvengersdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:n3u3d4!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Trading rules (BR-05, BR-08). An order is only accepted, and only filled, on a current market price: the
# latest quote must be younger than this (ISO-8601 duration). Live quotes stream in every few seconds while
# a market is open (scripts/live_quote_generator.py), so a minute without one means the feed has stopped or
# the market isn't trading.
leap.trading.max-price-age=PT1M
# Equities and FX can only be traded while their market is open (MarketHours.java). Set to false only for a
# demo outside market hours, together with the quote generator's --source simulated --all-hours mode.
leap.trading.enforce-market-hours=true
# Cash a newly registered trader's account opens with, recorded as a DEPOSIT (real payments are out of scope)
leap.accounts.opening-deposit=100000
# How long an ACCEPTED order waits before it is filled; it FAILS if the price moved meanwhile
leap.trading.order-delay=PT0.5S
# Restart recovery (BR-06, BR-14): at startup and then on this interval, orders still SUBMITTED or ACCEPTED
# well after they should have finished (order-delay + recovery-grace) are filled, failed or rejected
leap.trading.recovery-enabled=true
leap.trading.recovery-interval=PT10S
leap.trading.recovery-grace=PT5S
# Limit and stop orders wait as WORKING; on this interval those whose price the latest quote has reached are
# triggered and filled (WorkingOrderService). The price feed writes every few seconds, so a second is plenty.
leap.trading.working-orders-enabled=true
leap.trading.working-orders-interval=PT1S

# Reporting store (BR-16): filled orders are copied into reporting.trade_activity on this timer, and
# analysts' reports read only that, never the live trading tables
leap.reporting.load-enabled=true
leap.reporting.load-interval=PT1M
