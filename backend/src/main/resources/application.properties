# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Application Name
spring.application.name=leap-backend

# Logging
logging.level.root=INFO
logging.level.com.neueda.leap=DEBUG

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# JWT Configuration
jwt.secret=your-super-secret-key-change-this-in-production-to-something-very-long-and-random
jwt.expiration=3600000

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/leapvengersdb
spring.datasource.username=postgres
spring.datasource.password=n3u3d4!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
