# Production profile (SPRING_PROFILES_ACTIVE=prod), used by the container image on AWS.
# No defaults for secrets or the database: the app refuses to start unless they are set, so a deployment can
# never fall back to the development values in application.properties.
jwt.secret=${JWT_SECRET}
leap.exchange-rates.api-key=${EXCHANGE_RATE_API_KEY}
leap.exchange-rates.api-url=${EXCHANGE_RATE_API_URL:https://allratestoday.com/api/v1/rates}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Behind a load balancer: trust its X-Forwarded-* headers for the client's scheme and address
server.forward-headers-strategy=framework

# API docs are for development
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Less noise, compact JSON
logging.level.com.neueda.leap=INFO
spring.jackson.serialization.indent-output=false
spring.jpa.properties.hibernate.format_sql=false
